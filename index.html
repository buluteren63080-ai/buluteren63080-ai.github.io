<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Benim Sayfam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

:root {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --accent-color: #ff5722; /* Neon Turuncu Vurgu */
    --hover-color: #ffcc00;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: 'Space Mono', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    transition: all 0.3s ease;
}

.container {
    text-align: center;
    background: #1e1e1e;
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255, 87, 34, 0.2);
    border: 1px solid #333;
    max-width: 500px;
}

h1 {
    color: var(--accent-color);
    text-transform: uppercase;
    letter-spacing: 2px;
}

.social-links {
    margin: 30px 0;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.icon {
    font-size: 2rem;
    color: var(--text-color);
    text-decoration: none;
    transition: color 0.3s, transform 0.3s;
}

.icon:hover {
    color: var(--hover-color);
    transform: scale(1.2);
}

button {
    background-color: transparent;
    color: var(--accent-color);
    border: 2px solid var(--accent-color);
    padding: 10px 20px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.3s;
}

button:hover {
    background-color: var(--accent-color);
    color: var(--bg-color);
}

/* JS ile eklenecek glitch efekti sınıfı */
.glitch-active {
    animation: glitch 0.2s linear infinite;
}

@keyframes glitch {
    0% { transform: translate(0) }
    20% { transform: translate(-2px, 2px) }
    40% { transform: translate(-2px, -2px) }
    60% { transform: translate(2px, 2px) }
    80% { transform: translate(2px, -2px) }
    100% { transform: translate(0) }
}
        body { background: #121212; color: white; text-align: center; font-family: sans-serif; }
        .social-links a { font-size: 40px; margin: 20px; color: #ff5722; text-decoration: none; }
    </style>
</head>
<body>

    <h1>Merhaba!</h1>
    <div class="social-links">
        <a href="LINKEDIN_LINKIN" target="_blank"><i class="fab fa-linkedin"></i></a>
        <a href="LETTERBOXD_LINKIN" target="_blank"><i class="fas fa-film"></i></a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("glitch-btn");
    const container = document.querySelector(".container");

    btn.addEventListener("click", () => {
        // Tıklanınca kısa bir titreme (glitch) efekti veriyoruz
        container.classList.add("glitch-active");
        
        setTimeout(() => {
            container.classList.remove("glitch-active");
        }, 300); // 0.3 saniye sonra durur
    });
});
        console.log("Sistem çalışıyor.");
    </script>
</body>
</html>
